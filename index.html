
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
        }

        .container {
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #475569;
            line-height: 1.7;
        }

        .tag {
            display: inline-block;
            margin: 6px;
            padding: 10px 15px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1e40af;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hello from AWS EC2!</h1>
        <p>
            Welcome to my first DevOps deployment project.
            This website is deployed using Docker, Jenkins,
            Docker Hub and AWS EC2.
        </p>
        <div class="tag">HTML</div>
        <div class="tag">Docker</div>
        <div class="tag">Jenkins</div>
        <div class="tag">AWS</div>

        <footer>
            Automated CI/CD Deployment Project
        </footer>

    </div>

</body>
</html>
